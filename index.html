<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171C">
<title>Fluxo — controle financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171C;
    --surface:#1B1F26;
    --surface-2:#232833;
    --border:#2E3441;
    --text:#EDEAE3;
    --text-muted:#8B92A0;
    --accent:#C9A24B;
    --accent-dim:#8A7440;
    --income:#4F9B72;
    --income-dim:#2E4A3B;
    --expense:#C1613F;
    --expense-dim:#4A3129;
    --radius-s:8px;
    --radius-m:14px;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .serif{font-family:'Fraunces', Georgia, serif;}

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Header ---------- */
  header{
    padding:calc(20px + var(--safe-top)) 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{flex:none;}
  .brand h1{font-size:19px; margin:0; font-weight:600; letter-spacing:0.2px;}
  .brand p{margin:0; font-size:12px; color:var(--text-muted);}

  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px 16px;
    gap:12px;
  }
  .month-nav button{
    width:36px; height:36px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav .label{
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:500;
    text-transform:capitalize;
    flex:1;
    text-align:center;
  }

  main{
    flex:1;
    padding:0 20px 120px;
    overflow-y:auto;
  }

  .view{display:none;}
  .view.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* ---------- Saldo card ---------- */
  .saldo-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:22px 20px;
    margin-bottom:18px;
  }
  .saldo-card .eyebrow{
    font-size:12px;
    color:var(--text-muted);
    margin:0 0 4px;
  }
  .saldo-value{
    font-family:'Fraunces', serif;
    font-size:34px;
    font-weight:600;
    margin:0 0 14px;
    line-height:1.1;
  }
  .saldo-value.pos{color:var(--income);}
  .saldo-value.neg{color:var(--expense);}
  .saldo-sub{
    display:flex;
    gap:20px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  .saldo-sub div{flex:1;}
  .saldo-sub .k{font-size:11px; color:var(--text-muted); margin:0 0 3px;}
  .saldo-sub .v{font-size:15px; margin:0; font-weight:500;}
  .saldo-sub .v.income{color:var(--income);}
  .saldo-sub .v.expense{color:var(--expense);}

  .essential-row{
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  .essential-chip{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-s);
    padding:12px 14px;
  }
  .essential-chip .k{font-size:11px; color:var(--text-muted); margin:0 0 4px;}
  .essential-chip .v{font-size:15px; margin:0; font-weight:500; font-family:'Fraunces',serif;}

  /* ---------- Section heading ---------- */
  .section-title{
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 12px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }

  /* ---------- Budget bars ---------- */
  .budget-list{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:8px;
  }
  .budget-item .row1{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .budget-item .cat{font-size:13.5px; font-weight:500;}
  .budget-item .nums{font-size:12px; color:var(--text-muted);}
  .budget-item .nums strong{color:var(--text); font-weight:500;}
  .bar-track{
    position:relative;
    height:8px;
    background:var(--surface-2);
    border-radius:999px;
    overflow:visible;
  }
  .bar-fill{
    position:absolute; top:0; left:0; bottom:0;
    border-radius:999px;
    background:var(--income);
    transition:width .3s ease;
  }
  .bar-fill.over{background:var(--expense);}
  .bar-target{
    position:absolute; top:-3px; bottom:-3px;
    width:2px;
    background:var(--text-muted);
  }

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--text-muted);
  }
  .empty-state p{margin:6px 0; font-size:13.5px; line-height:1.5;}
  .empty-state .big{font-family:'Fraunces', serif; font-size:20px; color:var(--text); margin-bottom:4px;}

  /* ---------- Extrato ---------- */
  .day-group{margin-bottom:22px;}
  .day-label{
    font-size:12px;
    color:var(--text-muted);
    margin:0 0 8px;
    text-transform:capitalize;
  }
  .txn{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .txn:active{background:var(--surface-2);}
  .txn:last-child{border-bottom:none;}
  .txn .dot{
    width:7px; height:7px; border-radius:999px;
    background:var(--text-muted);
    flex:none;
  }
  .txn .dot.essential{background:var(--accent);}
  .txn .info{flex:1; min-width:0;}
  .txn .desc{font-size:14px; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .txn .meta{font-size:11.5px; color:var(--text-muted); margin:0;}
  .txn .amt{
    font-family:'Fraunces', serif;
    font-size:15px;
    font-weight:500;
    flex:none;
  }
  .txn .amt.income{color:var(--income);}
  .txn .amt.expense{color:var(--expense);}
  .txn .del{
    flex:none;
    width:28px; height:28px;
    border-radius:999px;
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Metas ---------- */
  .target-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .target-item .name{flex:1; font-size:14px;}
  .target-item .pct-input{
    width:64px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-s);
    color:var(--text);
    font-size:14px;
    padding:8px;
    text-align:right;
    font-family:'Fraunces', serif;
  }
  .target-sum{
    display:flex;
    justify-content:space-between;
    padding:16px 0 6px;
    font-size:13px;
    color:var(--text-muted);
  }
  .target-sum.warn{color:var(--expense);}
  .target-sum strong{color:var(--text); font-weight:500;}

  .btn{
    display:block;
    width:100%;
    padding:14px;
    border-radius:var(--radius-s);
    border:none;
    font-size:14.5px;
    font-weight:500;
    font-family:'IBM Plex Sans', sans-serif;
    margin-top:14px;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#1B1400;}
  .btn-ghost{background:var(--surface); color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:transparent; color:var(--expense); border:1px solid var(--expense-dim);}

  .config-row{display:flex; gap:10px;}
  .config-row .btn{flex:1;}

  /* ---------- Gerenciar categorias / contas ---------- */
  .manage-list{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .manage-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-s);
  }
  .manage-row .name{
    flex:1;
    min-width:0;
    font-size:13.5px;
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .manage-row .bucket-tag{
    flex:none;
    font-size:10px;
    color:var(--text-muted);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px 8px;
    white-space:nowrap;
  }
  .manage-row .icon-btn{
    flex:none;
    width:30px; height:30px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
  }
  .manage-row .icon-btn svg{width:14px; height:14px;}
  .manage-row .icon-btn.danger:active{color:var(--expense); border-color:var(--expense-dim);}
  .manage-empty{font-size:12.5px; color:var(--text-muted); padding:4px 0 8px;}
  .manage-edit-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:12px;
    background:var(--surface-2);
    border:1px dashed var(--border);
    border-radius:var(--radius-s);
  }
  .manage-edit-row input, .manage-edit-row select{
    flex:1;
    min-width:120px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-s);
    color:var(--text);
    font-size:14px;
    padding:10px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .manage-edit-row .edit-actions{display:flex; gap:8px; width:100%;}
  .manage-edit-row .edit-actions .btn{flex:1; margin-top:0;}
  .manage-add-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:24px;
  }
  .manage-add-row input, .manage-add-row select{
    flex:1;
    min-width:120px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-s);
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .manage-add-row .btn{width:100%; margin-top:0;}

  /* ---------- Projeção ---------- */
  .proj-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
  }
  .proj-row.current{background:rgba(201,162,75,0.07); margin:0 -20px; padding:13px 20px; border-radius:8px;}
  .proj-row .pm{flex:1; min-width:0;}
  .proj-row .pm .lbl{font-size:13.5px; font-weight:500; text-transform:capitalize;}
  .proj-row .pm .sub{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .proj-row .pv{text-align:right; flex:none;}
  .proj-row .pv .acc{font-family:'Fraunces', serif; font-size:15.5px; font-weight:500;}
  .proj-row .pv .acc.neg{color:var(--expense);}
  .proj-row .pv .acc.pos{color:var(--income);}
  .proj-row .pv .delta{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .proj-note{font-size:12.5px; color:var(--text-muted); margin:-6px 0 18px; line-height:1.5;}

  /* ---------- Investimentos ---------- */
  .invest-total-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:22px 20px;
    margin-bottom:22px;
  }
  .invest-total-card .eyebrow{font-size:12px; color:var(--text-muted); margin:0 0 4px;}
  .invest-total-value{font-family:'Fraunces', serif; font-size:30px; font-weight:600; margin:0 0 14px; line-height:1.1;}
  .invest-total-sub{display:flex; gap:14px; padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--border);}
  .invest-total-sub div{flex:1;}
  .invest-total-sub .k{font-size:10.5px; color:var(--text-muted); margin:0 0 3px;}
  .invest-total-sub .v{font-size:13.5px; margin:0; font-weight:500; font-family:'Fraunces',serif;}

  .osc-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .osc-chip{flex:1 1 calc(33.333% - 6px); min-width:84px; background:var(--surface-2); border-radius:var(--radius-s); padding:8px 10px;}
  .osc-chip .k{font-size:9.5px; color:var(--text-muted); margin:0 0 3px; text-transform:uppercase; letter-spacing:.3px;}
  .osc-chip .v{font-size:13px; font-weight:500; margin:0; font-family:'Fraunces',serif;}
  .osc-chip .v.pos{color:var(--income);}
  .osc-chip .v.neg{color:var(--expense);}
  .osc-chip .v.na{color:var(--text-muted); font-family:'IBM Plex Sans',sans-serif; font-size:11.5px;}

  .invest-cat-block{margin-bottom:26px;}
  .invest-cat-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
  }
  .invest-cat-header .name{font-size:14px; font-weight:600;}
  .invest-cat-header .total{font-family:'Fraunces', serif; font-size:15px;}
  .invest-cat-empty{font-size:12.5px; color:var(--text-muted); padding:2px 0 6px;}

  .invest-position{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-s);
    margin-bottom:10px;
    overflow:hidden;
  }
  .invest-position-row{
    display:flex; align-items:center; gap:10px;
    padding:13px 14px;
    cursor:pointer;
  }
  .invest-position-row:active{background:var(--surface-2);}
  .invest-position-row .info{flex:1; min-width:0;}
  .invest-position-row .info .nm{font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .invest-position-row .info .sub{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .invest-position-row .val{text-align:right; flex:none;}
  .invest-position-row .val .amt{font-family:'Fraunces', serif; font-size:14.5px;}
  .invest-position-row .val .chip{font-size:11px; margin-top:2px;}
  .invest-position-row .val .chip.pos{color:var(--income);}
  .invest-position-row .val .chip.neg{color:var(--expense);}
  .invest-position-row .val .chip.na{color:var(--text-muted);}
  .invest-position-row .chevron{flex:none; color:var(--text-muted); transition:transform .2s ease;}
  .invest-position.open .chevron{transform:rotate(180deg);}

  .invest-position-detail{
    padding:2px 14px 16px;
    border-top:1px solid var(--border);
  }
  .invest-position-detail .detail-title{font-size:11px; color:var(--text-muted); margin:14px 0 8px; text-transform:uppercase; letter-spacing:.3px;}
  .invest-position-detail .actions-row{display:flex; gap:8px; margin-top:14px;}
  .invest-position-detail .actions-row .btn{flex:1; margin-top:0;}
  .invest-history-list{display:flex; flex-direction:column; gap:0;}
  .invest-history-item{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--border);
  }
  .invest-history-item:last-child{border-bottom:none;}
  .invest-history-item .d{color:var(--text-muted);}
  .invest-history-item .v{font-family:'Fraunces', serif;}
  .invest-history-item .del-h{background:none;border:none;color:var(--text-muted);font-size:15px;flex:none;padding:2px 8px;}
  .invest-add-snap{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;
    padding:12px; background:var(--surface-2); border:1px dashed var(--border); border-radius:var(--radius-s);
  }
  .invest-add-snap input{
    flex:1; min-width:110px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s);
    color:var(--text); font-size:14px; padding:10px; font-family:'IBM Plex Sans',sans-serif;
  }
  .invest-add-snap .btn{width:100%; margin-top:2px;}
  .invest-edit-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .invest-edit-row input, .invest-edit-row select{
    flex:1; min-width:110px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s);
    color:var(--text); font-size:14px; padding:10px; font-family:'IBM Plex Sans',sans-serif;
  }
  .invest-edit-row .edit-actions{display:flex; gap:8px; width:100%;}
  .invest-edit-row .edit-actions .btn{flex:1; margin-top:0;}
  .invest-edit-row .field-full{width:100%;}
  .invest-edit-row .field-full label{display:block; font-size:11px; color:var(--text-muted); margin-bottom:4px;}

  .invest-cash-card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:16px 18px;
    margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .invest-cash-card .k{font-size:12px; color:var(--text-muted); margin:0 0 4px;}
  .invest-cash-card .v{font-family:'Fraunces', serif; font-size:18px; margin:0;}

  .invest-pm-line{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .invest-gain-line{font-size:12px; margin-top:2px;}
  .invest-gain-line.pos{color:var(--income);}
  .invest-gain-line.neg{color:var(--expense);}

  .invest-status-badge{
    display:inline-block; font-size:10px; padding:2px 8px; border-radius:999px;
    background:var(--surface-2); color:var(--text-muted); margin-left:6px; vertical-align:middle;
  }
  .invest-maturity-line{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .invest-maturity-banner{
    font-size:12px; background:var(--expense-dim); color:var(--expense);
    border-radius:var(--radius-s); padding:10px 12px; margin:10px 0;
  }

  /* segmented control (vencimento indefinido/definido) */
  .seg{display:flex; background:var(--surface-2); border-radius:var(--radius-s); padding:4px; gap:2px;}
  .seg-btn{flex:1; padding:9px 4px; border:none; background:none; color:var(--text-muted); border-radius:6px; font-size:12.5px; font-weight:500; font-family:'IBM Plex Sans', sans-serif;}
  .seg-btn.active{background:var(--accent-dim); color:var(--accent);}

  .sheet-sub{font-size:12.5px; color:var(--text-muted); margin:-12px 0 16px;}
  .redeem-preview{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s);
    padding:12px 14px; margin:4px 0 10px; font-size:13px; display:flex; flex-direction:column; gap:6px;
  }
  .redeem-preview .row{display:flex; justify-content:space-between;}
  .redeem-preview .row .k{color:var(--text-muted);}
  .redeem-preview .row.total .v{font-family:'Fraunces', serif; font-size:15px;}
  .redeem-note{font-size:11.5px; color:var(--text-muted); line-height:1.5; margin:0 0 16px;}

  /* ---------- Tab bar ---------- */
  nav.tabbar{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:rgba(27,31,38,0.92);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding:8px 12px calc(8px + var(--safe-bottom));
    display:flex;
    justify-content:space-around;
  }
  nav.tabbar button{
    background:none; border:none;
    color:var(--text-muted);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:10.5px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 6px;
    border-radius:10px;
    flex:1;
  }
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar button svg{width:20px; height:20px;}

  .fab{
    position:fixed;
    right:calc(50% - 240px + 20px);
    bottom:calc(74px + var(--safe-bottom));
    width:56px; height:56px;
    border-radius:999px;
    background:var(--accent);
    color:#1B1400;
    border:none;
    font-size:26px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  @media (max-width:480px){
    .fab{right:20px;}
  }

  /* ---------- Bottom sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.5);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:40;
  }
  .sheet-backdrop.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:var(--surface);
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    border:1px solid var(--border);
    padding:10px 20px calc(24px + var(--safe-bottom));
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    z-index:41;
    max-height:85vh;
    overflow-y:auto;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{
    width:36px; height:4px; background:var(--border);
    border-radius:999px; margin:6px auto 16px;
  }
  .sheet h2{font-family:'Fraunces', serif; font-size:19px; margin:0 0 18px; font-weight:600;}

  .type-toggle{
    display:flex;
    background:var(--surface-2);
    border-radius:var(--radius-s);
    padding:4px;
    margin-bottom:16px;
  }
  .type-toggle button{
    flex:1; padding:10px; border:none; background:none;

    border-radius:6px;
    font-size:13.5px;
    font-weight:500;
    font-family:'IBM Plex Sans', sans-serif;

  .type-toggle button.active.expense{background:var(--expense-dim); color:var(--expense);}

  .pay-toggle{
    display:flex;
    background:var(--surface-2);
    border-radius:var(--radius-s);
    padding:4px;
    gap:2px;
  }
  .pay-toggle button{
    flex:1; padding:10px 4px; border:none; background:none;
    color:var(--text-muted);
    border-radius:6px;
    font-size:13px;
    font-weight:500;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .pay-toggle button.active{background:var(--accent-dim); color:var(--accent);}

  .credit-extra{
    margin-top:12px;
    padding:12px;
    background:var(--surface-2);
    border:1px dashed var(--border);
    border-radius:var(--radius-s);
  }
  .credit-extra .field:last-child{margin-bottom:0;}
  .credit-extra .hint{font-size:11.5px; color:var(--text-muted); margin:0 0 12px;}

  .cat-add-row{
    margin-top:10px;
    padding:12px;
    background:var(--surface-2);
    border:1px dashed var(--border);
    border-radius:var(--radius-s);
  }
  .cat-add-row .field{margin-bottom:10px;}
  .cat-add-row .field:last-child{margin-bottom:0;}
  .btn-small{
    display:inline-block;
    width:auto;
    padding:9px 16px;
    margin-top:0;
    font-size:13px;
  }

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;}
  .field input, .field select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-s);
    color:var(--text);
    font-size:15px;
    padding:12px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent-dim); outline-offset:1px;}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}

  .check-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-s);
    padding:12px 14px;
    margin-bottom:14px;
  }
  .check-row label{font-size:13.5px;}
  .switch{
    width:42px; height:24px; border-radius:999px;
    background:var(--border);

    flex:none;
  }
  .switch.on{background:var(--accent-dim);}
  .switch .knob{
    position:absolute; top:3px; left:3px;
    width:18px; height:18px; border-radius:999px;
    background:var(--text-muted);
    transition:left .15s ease, background .15s ease;
  }
  .switch.on .knob{left:21px; background:var(--accent);}

  .field-amount{
    display:flex; align-items:center;

    border-radius:var(--radius-s);

    border:none; background:none; padding:12px 6px;

  }
  .field-amount input:focus{outline:none;}

  .toast{
    position:fixed;
    bottom:calc(90px + var(--safe-bottom));
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{display:none;}
</style>

<script>
(function(){
  "use strict";

  /* ---------------- storage adapter ----------------
     Tries the Claude artifact persistent storage API first
     (window.storage). If this file is opened directly as a
     standalone HTML file in a phone browser, that API won't
     exist, so it falls back to localStorage — which works fine
     in a real browser tab. */
  const Storage = {
    async get(key){
      try{
        if (window.storage){
          const r = await window.storage.get(key);
          return r ? JSON.parse(r.value) : null;
        }
      }catch(e){ /* not found or unsupported, fall through */ }
      try{
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : null;
      }catch(e){ return null; }
    },
    async set(key, value){
      try{
        if (window.storage){
          const r = await window.storage.set(key, JSON.stringify(value));
          if (r) return;
        }
      }catch(e){ /* fall through to localStorage */ }
      try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* ignore */ }
    }
  };

  const TXN_KEY = 'fluxo_transactions';
  const TARGET_KEY = 'fluxo_budget_targets';
  const CATEGORY_KEY = 'fluxo_categories';
  const ACCOUNT_KEY = 'fluxo_accounts';
  const INVEST_KEY = 'fluxo_investments';
  const INVEST_CASH_KEY = 'fluxo_invest_cash_balance';

  const DEFAULT_TARGETS = {
    'FIXA': 40, 'LAZER': 10, 'PRAZERES': 10, 'CONFORTO': 5,
    'METAS': 5, 'EDUCAÇÃO': 5, 'LIBERDADE FINANCEIRA': 25
  };
  const BUCKETS = Object.keys(DEFAULT_TARGETS);
  const INCOME_CATS = ['Fixa', 'Variável', 'Vale/Benefícios'];

  // Categoria -> orçamento (bucket), com base no arquivo original a partir de Ago/2026
  const DEFAULT_CATEGORIES = {
    'Aluguel': 'FIXA',
    'Moradia': 'FIXA',
    'Energia': 'FIXA',
    'Gás': 'FIXA',
    'Saúde': 'FIXA',
    'Cartão de Crédito': 'CONFORTO',
    'Casa': 'CONFORTO',
    'Diversos': 'CONFORTO',
    'Entretenimento': 'CONFORTO',
    'Educação': 'EDUCAÇÃO'
  };
  const PAY_LABELS = { pix: 'PIX', debito: 'Débito', credito: 'Crédito' };

  // Contas usadas para marcar de onde saiu/entrou o dinheiro
  const DEFAULT_ACCOUNTS = ['NuConta', 'C6', 'XP', 'BTG', 'PORTO', 'VA', 'VR', 'Caju', 'Dinheiro'];

  // Categorias de investimento e períodos de oscilação acompanhados
  const INVEST_CATEGORIES = ['Renda Fixa', 'Renda Variável', 'Reserva de Emergência'];
  const OSC_PERIODS = [
    { key: 'dia', label: 'Diária', calc: (iso) => addDaysISO(iso, -1) },
    { key: 'semana', label: 'Semanal', calc: (iso) => addDaysISO(iso, -7) },
    { key: 'mes', label: 'Mensal', calc: (iso) => addMonths(iso, -1) },
    { key: 'trimestre', label: 'Trimestral', calc: (iso) => addMonths(iso, -3) },
    { key: 'semestre', label: 'Semestral', calc: (iso) => addMonths(iso, -6) },
    { key: 'ano', label: 'Anual', calc: (iso) => addMonths(iso, -12) }
  ];

  const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  const ICON_DEL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>`;

  // Lançamentos futuros importados da planilha (Setembro/2026 em diante),
  // usados para semear o app na primeira vez que ele roda (não sobrescreve
  // dados que você já tenha lançado manualmente).
  const SEED_TRANSACTIONS = [];

  let state = {
    transactions: [],
    targets: {...DEFAULT_TARGETS},
    categories: {...DEFAULT_CATEGORIES},
    accounts: [...DEFAULT_ACCOUNTS],
    investments: [],
    investCashBalance: 0,
    currentMonth: new Date(),
    activeTab: 'resumo',
    formType: 'despesa',
    paymentMethod: 'pix',
    editingId: null,
    editingCategoryName: null,
    editingAccountName: null,
    expandedInvestmentId: null,
    editingInvestmentId: null,
    redeemPositionId: null,
    lotPositionId: null
  };

  const fmtBRL = (n) => new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'}).format(n || 0);
  const monthKey = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  const monthLabel = (d) => {
    const s = d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
    return s.charAt(0).toUpperCase() + s.slice(1);
  };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
  const todayISO = () => new Date().toISOString().slice(0,10);
  const addMonths = (isoDate, n) => {
    const [y,m,d] = isoDate.split('-').map(Number);
    const targetMonthIndex = (m-1) + n;
    // último dia do mês de destino (dia 0 do mês seguinte)
    const lastDayOfTargetMonth = new Date(y, targetMonthIndex + 1, 0).getDate();
    // limita o dia ao último dia válido do mês de destino, evitando "estourar" para o mês seguinte
    const safeDay = Math.min(d, lastDayOfTargetMonth);
    const dt = new Date(y, targetMonthIndex, safeDay);
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  };
  const addDaysISO = (isoDate, n) => {
    const [y,m,d] = isoDate.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate() + n);
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  };
  const fmtPct = (n) => (n >= 0 ? '+' : '') + n.toFixed(2).replace('.', ',') + '%';

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  /* ---------------- data load/save ---------------- */
  async function loadAll(){
    const txns = await Storage.get(TXN_KEY);
    const targets = await Storage.get(TARGET_KEY);
    const categories = await Storage.get(CATEGORY_KEY);
    const accounts = await Storage.get(ACCOUNT_KEY);
    const investments = await Storage.get(INVEST_KEY);
    const investCash = await Storage.get(INVEST_CASH_KEY);
    state.targets = targets && typeof targets === 'object' ? targets : {...DEFAULT_TARGETS};
    state.categories = categories && typeof categories === 'object' ? categories : {...DEFAULT_CATEGORIES};
    state.accounts = Array.isArray(accounts) ? accounts : [...DEFAULT_ACCOUNTS];
    state.investments = Array.isArray(investments) ? investments : [];
    state.investCashBalance = typeof investCash === 'number' ? investCash : 0;
    const maturedCount = await processMaturedFixedIncome();
    if (Array.isArray(txns)){
      // já existe uma chave salva (mesmo vazia, ex: depois de "Apagar tudo") — respeita como está
      state.transactions = txns;
    } else {
      // nunca foi salvo antes: primeiro uso, semeia com a projeção vinda da planilha
      state.transactions = SEED_TRANSACTIONS.map(t => ({...t}));
      await saveTxns();
    }
    // migração: garante que contas já usadas em lançamentos antigos (texto livre) apareçam na lista gerenciável
    const usedAccounts = new Set(state.transactions.map(t => t.account).filter(Boolean));
    let accountsChanged = false;
    usedAccounts.forEach(a => {
      if (!state.accounts.some(x => x.toLowerCase() === a.toLowerCase())){
        state.accounts.push(a);
        accountsChanged = true;
      }
    });
    if (accountsChanged) await saveAccounts();
    return maturedCount;
  }
  async function saveTxns(){ await Storage.set(TXN_KEY, state.transactions); }
  async function saveTargets(){ await Storage.set(TARGET_KEY, state.targets); }
  async function saveCategories(){ await Storage.set(CATEGORY_KEY, state.categories); }
  async function saveAccounts(){ await Storage.set(ACCOUNT_KEY, state.accounts); }
  async function saveInvestments(){ await Storage.set(INVEST_KEY, state.investments); }
  async function saveInvestCashBalance(){ await Storage.set(INVEST_CASH_KEY, state.investCashBalance); }

  /* ---------------- categorias / contas: renomear, excluir, contar uso ---------------- */
  function categoryInUseCount(name){
    return state.transactions.filter(t => t.category === name).length;
  }
  function renameCategory(oldName, newName, newBucket){
    const bucketChanged = state.categories[oldName] !== newBucket;
    if (oldName !== newName) delete state.categories[oldName];
    state.categories[newName] = newBucket;
    if (oldName !== newName || bucketChanged){
      state.transactions.forEach(t => {
        if (t.category === oldName){
          t.category = newName;
          t.bucket = newBucket;
        }
      });
    }
  }
  function deleteCategoryByName(name){
    delete state.categories[name];
  }
  function accountInUseCount(name){
    return state.transactions.filter(t => t.account === name).length;
  }
  function renameAccountByName(oldName, newName){
    state.accounts = state.accounts.map(a => a === oldName ? newName : a);
    if (oldName !== newName){
      state.transactions.forEach(t => { if (t.account === oldName) t.account = newName; });
    }
  }
  function deleteAccountByName(name){
    state.accounts = state.accounts.filter(a => a !== name);
  }

  /* ---------------- computations ---------------- */
  function txnsForMonth(mk){
    return state.transactions.filter(t => t.date.slice(0,7) === mk);
  }

  function monthTotals(mk){
    const list = txnsForMonth(mk);
    let income = 0, expense = 0, essential = 0, nonEssential = 0;
    const byBucket = {};
    BUCKETS.forEach(c => byBucket[c] = 0);
    list.forEach(t => {
      if (t.type === 'receita'){
        income += t.amount;
      } else {
        expense += t.amount;
        const bucket = t.bucket || state.categories[t.category] || 'CONFORTO';
        byBucket[bucket] = (byBucket[bucket] || 0) + t.amount;
        if (t.essential) essential += t.amount; else nonEssential += t.amount;
      }
    });
    return { income, expense, saldo: income - expense, byBucket, essential, nonEssential };
  }

  /* ---------------- investimentos: cálculos ---------------- */
  // Cada posição guarda uma linha do tempo de eventos: aporte (compra/aumento),
  // mark (atualização de valor de mercado) e resgate (venda parcial ou total).
  // O valor/quantidade/custo "atuais" são sempre recalculados a partir dela (replay),
  // nunca guardados soltos — isso evita inconsistência entre valor, PM e histórico.

  const MS_DAY = 86400000;
  function dateToNum(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return Date.UTC(y, m-1, d) / MS_DAY;
  }
  function fmtDateBR(iso){
    return new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR');
  }

  // Tabela regressiva do IR para renda fixa (dias corridos desde o aporte, em média ponderada).
  function irRegressiveRate(days){
    if (days <= 180) return 0.225;
    if (days <= 360) return 0.20;
    if (days <= 720) return 0.175;
    return 0.15;
  }

  function sortedEvents(position, uptoISO){
    return position.events
      .filter(e => !uptoISO || e.date <= uptoISO)
      .slice()
      .sort((a,b) => a.date.localeCompare(b.date));
  }

  // "Replay" da posição: processa os eventos em ordem e devolve o estado resultante
  // (valor atual, custo total investido ainda na posição, quantidade e a soma
  // ponderada de datas do custo — usada pra estimar a data média de aporte).
  function replayPosition(position, uptoISO){
    const events = sortedEvents(position, uptoISO);
    let value = 0, costBasis = 0, costDateSum = 0, quantity = 0, lastEventDate = null;
    events.forEach(e => {
      const dateNum = dateToNum(e.date);
      if (e.type === 'aporte'){
        value += e.amount;
        costBasis += e.amount;
        costDateSum += e.amount * dateNum;
        quantity += (e.quantity || 0);
      } else if (e.type === 'mark'){
        value = e.value;
      } else if (e.type === 'resgate'){
        value -= e.amount;
        costBasis -= (e.costBasisRemoved || 0);
        costDateSum -= (e.costDateSumRemoved || 0);
        quantity -= (e.quantityRemoved || 0);
      }
      lastEventDate = e.date;
    });
    return {
      value: Math.max(0, value),
      costBasis: Math.max(0, costBasis),
      costDateSum: Math.max(0, costDateSum),
      quantity: Math.max(0, quantity),
      lastEventDate
    };
  }
  function valueAtDate(position, targetISO){
    const st = replayPosition(position, targetISO);
    if (!st.lastEventDate) return null;
    return st;
  }
  function positionQuantityPM(position){
    const st = replayPosition(position);
    if (st.quantity > 0.000001) return { quantity: st.quantity, pm: st.costBasis / st.quantity };
    return null;
  }
  // Soma de aportes menos resgates entre duas datas — usada pra "descontar" o efeito
  // de dinheiro novo/saída na hora de calcular oscilação (queremos ver só o efeito de mercado).
  function netCashFlowBetween(position, fromISOExclusive, toISOInclusive){
    let net = 0;
    position.events.forEach(e => {
      if (e.date > fromISOExclusive && e.date <= toISOInclusive){
        if (e.type === 'aporte') net += e.amount;
        else if (e.type === 'resgate') net -= e.amount;
      }
    });
    return net;
  }
  // Margem de tolerância: só mostramos a oscilação de um período se existir um
  // registro (aporte/atualização/resgate) razoavelmente perto da data-alvo daquele
  // período — senão a % fica enganosa (compara com um valor velho demais).
  function toleranceDays(periodKey){
    switch(periodKey){
      case 'dia': return 2;
      case 'semana': return 10;
      case 'mes': return 40;
      case 'trimestre': return 100;
      case 'semestre': return 200;
      case 'ano': return 400;
      default: return Infinity;
    }
  }
  // Oscilação % de uma posição individual, sempre referenciada a hoje, líquida de aportes/resgates no período.
  function positionOscillations(position){
    const result = {};
    const now = replayPosition(position);
    if (!now.lastEventDate) return result;
    const today = todayISO();
    OSC_PERIODS.forEach(p => {
      const targetISO = p.calc(today);
      const past = valueAtDate(position, targetISO);
      if (!past || past.value === 0){ result[p.key] = null; return; }
      const gap = dateToNum(targetISO) - dateToNum(past.lastEventDate);
      if (gap > toleranceDays(p.key)){ result[p.key] = null; return; }
      const netFlow = netCashFlowBetween(position, targetISO, today);
      result[p.key] = ((now.value - netFlow - past.value) / past.value) * 100;
    });
    const first = sortedEvents(position)[0];
    if (first){
      const pastIni = valueAtDate(position, first.date);
      if (pastIni && pastIni.value !== 0){
        const netFlowIni = netCashFlowBetween(position, first.date, today);
        result.inicio = ((now.value - netFlowIni - pastIni.value) / pastIni.value) * 100;
      } else result.inicio = null;
    } else result.inicio = null;
    return result;
  }
  function positionsByCategory(category){
    return state.investments.filter(p => p.category === category);
  }
  function currentTotal(positions){
    return positions.reduce((s,p) => s + replayPosition(p).value, 0);
  }
  // Oscilação % agregada (categoria ou carteira inteira).
  function aggregateOscillations(positions){
    const today = todayISO();
    const current = currentTotal(positions);
    const result = { current, osc: {} };
    OSC_PERIODS.forEach(per => {
      const targetISO = per.calc(today);
      let pastSum = 0, netFlowSum = 0, any = false;
      positions.forEach(p => {
        const past = valueAtDate(p, targetISO);
        if (past){
          const gap = dateToNum(targetISO) - dateToNum(past.lastEventDate);
          if (gap <= toleranceDays(per.key)){
            pastSum += past.value;
            netFlowSum += netCashFlowBetween(p, targetISO, today);
            any = true;
          }
        }
      });
      result.osc[per.key] = (any && pastSum !== 0) ? (((current - netFlowSum) - pastSum) / pastSum) * 100 : null;
    });
    const firstDates = positions.map(p => { const f = sortedEvents(p)[0]; return f ? f.date : null; }).filter(Boolean);
    if (firstDates.length){
      const earliest = firstDates.sort()[0];
      let pastSum = 0, netFlowSum = 0, any = false;
      positions.forEach(p => {
        const past = valueAtDate(p, earliest);
        if (past){ pastSum += past.value; netFlowSum += netCashFlowBetween(p, earliest, today); any = true; }
      });
      result.osc.inicio = (any && pastSum !== 0) ? (((current - netFlowSum) - pastSum) / pastSum) * 100 : null;
    } else {
      result.osc.inicio = null;
    }
    return result;
  }
  function oscChipHtml(label, pct){
    if (pct === null || pct === undefined || isNaN(pct)){
      return `<div class="osc-chip"><p class="k">${label}</p><p class="v na">—</p></div>`;
    }
    const cls = pct > 0 ? 'pos' : (pct < 0 ? 'neg' : '');
    return `<div class="osc-chip"><p class="k">${label}</p><p class="v ${cls}">${fmtPct(pct)}</p></div>`;
  }
  function oscGridHtml(oscObj){
    const chips = OSC_PERIODS.map(p => oscChipHtml(p.label, oscObj[p.key])).join('')
      + oscChipHtml('Desde o início', oscObj.inicio);
    return `<div class="osc-grid">${chips}</div>`;
  }

  // Prévia de um resgate (venda/desfazer posição): calcula, de forma proporcional
  // ao valor atual, quanto do valor resgatado é principal e quanto é ganho, sugere
  // uma alíquota de IR (regressiva pra renda fixa, 15% padrão pra renda variável) e
  // devolve o valor líquido estimado. taxRateOverride (0–1) substitui a alíquota sugerida.
  function previewRedeem(position, redeemDateISO, amount, taxRateOverride){
    const now = replayPosition(position);
    const currentValue = now.value;
    if (currentValue <= 0 || !amount || amount <= 0) return null;
    const fraction = Math.min(amount / currentValue, 1);
    const costBasisRemoved = now.costBasis * fraction;
    const costDateSumRemoved = now.costDateSum * fraction;
    const quantityRemoved = now.quantity * fraction;
    const gain = amount - costBasisRemoved;
    let suggestedRate;
    if (position.category === 'Renda Variável'){
      suggestedRate = 0.15;
    } else {
      const weightedDateNum = now.costBasis > 0 ? now.costDateSum / now.costBasis : dateToNum(redeemDateISO);
      const daysHeld = Math.max(0, dateToNum(redeemDateISO) - weightedDateNum);
      suggestedRate = irRegressiveRate(daysHeld);
    }
    const rate = (taxRateOverride !== null && taxRateOverride !== undefined && !isNaN(taxRateOverride)) ? taxRateOverride : suggestedRate;
    const taxDue = gain > 0 ? gain * rate : 0;
    const netAmount = amount - taxDue;
    return {
      currentValue, fraction, costBasisRemoved, costDateSumRemoved, quantityRemoved,
      gain, suggestedRate, rate, taxDue, netAmount,
      full: amount >= currentValue - 0.005
    };
  }

  // No carregamento, resgata automaticamente (a valor de mercado) qualquer título de
  // Renda Fixa com vencimento definido já vencido, e joga o líquido pro saldo livre.
  async function processMaturedFixedIncome(){
    const today = todayISO();
    let changed = false, count = 0;
    state.investments.forEach(p => {
      if (p.category === 'Renda Fixa' && p.maturity && p.maturity.type === 'definido' &&
          p.maturity.date && p.maturity.date <= today && p.status !== 'encerrada'){
        const st = replayPosition(p);
        if (st.value > 0.005){
          const preview = previewRedeem(p, p.maturity.date, st.value, null);
          if (preview){
            p.events.push({
              id: uid(), type: 'resgate', date: p.maturity.date, amount: st.value,
              costBasisRemoved: preview.costBasisRemoved, costDateSumRemoved: preview.costDateSumRemoved,
              quantityRemoved: preview.quantityRemoved, gain: preview.gain,
              taxRate: preview.suggestedRate, taxDue: preview.taxDue, netAmount: preview.netAmount,
              full: true, note: 'Resgate automático no vencimento'
            });
            state.investCashBalance = (state.investCashBalance || 0) + preview.netAmount;
            count++;
          }
        }
        p.status = 'encerrada';
        changed = true;
      }
    });
    if (changed){
      await saveInvestments();
      await saveInvestCashBalance();
    }
    return count;
  }

  /* ---------------- rendering: Resumo ---------------- */
  function renderResumo(){
    const mk = monthKey(state.currentMonth);
    const totals = monthTotals(mk);
    const el = document.getElementById('view-resumo');

    if (state.transactions.length === 0){
      el.innerHTML = `<div class="empty-state">
        <p class="big">Nenhum lançamento ainda</p>

      </div>`;
      return;
    }

    const saldoClass = totals.saldo >= 0 ? 'pos' : 'neg';

    let barsHtml = '';
    if (totals.income > 0){
      barsHtml = BUCKETS.map(cat => {
        const spent = totals.byBucket[cat] || 0;
        const targetPct = state.targets[cat] || 0;
        const realPct = totals.income > 0 ? (spent / totals.income) * 100 : 0;
        const over = realPct > targetPct;
        const fillPct = Math.min(realPct, 100);
        return `<div class="budget-item">
          <div class="row1">
            <span class="cat">${cat}</span>
            <span class="nums"><strong>${fmtBRL(spent)}</strong> · ${realPct.toFixed(0)}% / meta ${targetPct}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill ${over ? 'over' : ''}" style="width:${fillPct}%"></div>
            <div class="bar-target" style="left:${Math.min(targetPct,100)}%"></div>
          </div>
        </div>`;
      }).join('');
    } else {
      barsHtml = `<div class="empty-state" style="padding:24px 0;">
        <p>Lance uma receita neste mês para ver o orçamento por categoria comparado com suas metas.</p>
      </div>`;
    }

    el.innerHTML = `
      <div class="saldo-card">
        <p class="eyebrow">Saldo do mês</p>
        <p class="saldo-value serif ${saldoClass}">${fmtBRL(totals.saldo)}</p>
        <div class="saldo-sub">
          <div>
            <p class="k">Receita</p>
            <p class="v income">${fmtBRL(totals.income)}</p>
          </div>
          <div>
            <p class="k">Despesa</p>
            <p class="v expense">${fmtBRL(totals.expense)}</p>
          </div>
        </div>
      </div>

      <div class="essential-row">
        <div class="essential-chip">
          <p class="k">Essencial</p>

        </div>
        <div class="essential-chip">
          <p class="k">Não essencial</p>
          <p class="v serif">${fmtBRL(totals.nonEssential)}</p>
        </div>
      </div>

      <p class="section-title">Orçamento por categoria</p>

  /* ---------------- rendering: Extrato ---------------- */
  function renderExtrato(){
    const mk = monthKey(state.currentMonth);
    const list = txnsForMonth(mk).slice().sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
    const el = document.getElementById('view-extrato');

  /* ---------------- rendering: Metas ---------------- */
  function renderMetas(){
    const el = document.getElementById('view-metas');
    const sum = BUCKETS.reduce((s,c) => s + (Number(state.targets[c]) || 0), 0);
    const rows = BUCKETS.map(cat => `
      <div class="target-item">
        <span class="name">${cat}</span>
        <input type="number" class="pct-input" data-target="${cat}" value="${state.targets[cat]}" min="0" max="100" step="1">
        <span style="color:var(--text-muted); font-size:13px;">%</span>
      </div>
    `).join('');

    el.innerHTML = `
      <p class="section-title">Metas de orçamento</p>
      <p style="font-size:12.5px; color:var(--text-muted); margin:-6px 0 16px; line-height:1.5;">
        Percentual ideal da sua receita mensal para cada categoria. É contra isso que o Resumo compara seus gastos reais.

      ${rows}
      <div class="target-sum ${sum !== 100 ? 'warn' : ''}">

      </div>
      <button class="btn btn-primary" id="saveTargetsBtn">Salvar metas</button>

      ${SEED_TRANSACTIONS.length > 0 ? `
      <p class="section-title" style="margin-top:32px;">Base da planilha</p>
      <p style="font-size:12.5px; color:var(--text-muted); margin:-6px 0 12px; line-height:1.5;">
        Carrega os lançamentos previstos de Set/2026 em diante vindos da sua planilha. Pode tocar quantas vezes quiser — o que já foi carregado não duplica.
      </p>
      <button class="btn btn-ghost" id="loadSeedBtn">Carregar base da planilha</button>
      ` : ''}

      <p class="section-title" style="margin-top:32px;">Categorias</p>
      <p style="font-size:12.5px; color:var(--text-muted); margin:-6px 0 12px; line-height:1.5;">
        Crie, renomeie ou exclua categorias de despesa. Excluir uma categoria não altera lançamentos já lançados com ela.
      </p>
      <div class="manage-list" id="catManageList">${renderCategoryManageRows()}</div>
      <div class="manage-add-row">
        <input type="text" id="mNewCatName" placeholder="Nova categoria">
        <select id="mNewCatBucket">${bucketOptionsHtml()}</select>
        <button type="button" class="btn btn-primary btn-small" id="mAddCatBtn">Adicionar categoria</button>
      </div>

      <p class="section-title" style="margin-top:32px;">Contas</p>
      <p style="font-size:12.5px; color:var(--text-muted); margin:-6px 0 12px; line-height:1.5;">
        Crie, renomeie ou exclua as contas usadas nos lançamentos (bancos, cartões, dinheiro etc.).
      </p>
      <div class="manage-list" id="accManageList">${renderAccountManageRows()}</div>
      <div class="manage-add-row">
        <input type="text" id="mNewAccName" placeholder="Nova conta">
        <button type="button" class="btn btn-primary btn-small" id="mAddAccBtn">Adicionar conta</button>
      </div>

      <p class="section-title" style="margin-top:32px;">Seus dados</p>
      <div class="config-row">
        <button class="btn btn-ghost" id="exportBtn">Exportar</button>
        <button class="btn btn-ghost" id="importBtn">Importar</button>
      </div>
      <button class="btn btn-danger" id="resetBtn">Apagar todos os lançamentos</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    `;

    document.getElementById('saveTargetsBtn').addEventListener('click', async () => {
      BUCKETS.forEach(cat => {
        const input = el.querySelector(`[data-target="${cat}"]`);
        state.targets[cat] = Number(input.value) || 0;
      });
      await saveTargets();
      toast('Metas salvas');
      renderMetas();
    });

    document.getElementById('mAddCatBtn').addEventListener('click', async () => {
      const nameInput = document.getElementById('mNewCatName');
      const name = nameInput.value.trim();
      const bucket = document.getElementById('mNewCatBucket').value;
      if (!name){
        toast('Dê um nome pra categoria');
        return;
      }
      const dup = Object.keys(state.categories).some(c => c.toLowerCase() === name.toLowerCase());
      if (dup){
        toast('Já existe uma categoria com esse nome');
        return;
      }
      state.categories[name] = bucket;
      await saveCategories();
      toast('Categoria criada');
      renderMetas();
    });

    document.getElementById('mAddAccBtn').addEventListener('click', async () => {
      const nameInput = document.getElementById('mNewAccName');
      const name = nameInput.value.trim();
      if (!name){
        toast('Dê um nome pra conta');
        return;
      }
      const dup = state.accounts.some(a => a.toLowerCase() === name.toLowerCase());
      if (dup){
        toast('Já existe uma conta com esse nome');
        return;
      }
      state.accounts.push(name);
      await saveAccounts();
      toast('Conta criada');
      renderMetas();
    });

    const loadSeedBtn = document.getElementById('loadSeedBtn');
    if (loadSeedBtn){
      loadSeedBtn.addEventListener('click', async () => {
        const existingIds = new Set(state.transactions.map(t => t.id));
        const toAdd = SEED_TRANSACTIONS.filter(t => !existingIds.has(t.id));
        if (toAdd.length === 0){
          toast('A base já está carregada');
          return;
        }
        state.transactions.push(...toAdd.map(t => ({...t})));
        await saveTxns();
        toast(`${toAdd.length} lançamentos carregados`);
        renderAll();
      });
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = JSON.stringify({transactions: state.transactions, targets: state.targets, categories: state.categories, accounts: state.accounts, investments: state.investments, investCashBalance: state.investCashBalance}, null, 2);
      const blob = new Blob([data], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fluxo-backup-' + todayISO() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast('Backup exportado');
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try{
        const text = await file.text();
        const data = JSON.parse(text);
        if (Array.isArray(data.transactions)){
          state.transactions = data.transactions;
          await saveTxns();
        }
        if (data.targets){
          state.targets = data.targets;
          await saveTargets();
        }
        if (data.categories){
          state.categories = data.categories;
          await saveCategories();
        }
        if (Array.isArray(data.accounts)){
          state.accounts = data.accounts;
          await saveAccounts();
        }
        if (Array.isArray(data.investments)){
          state.investments = data.investments;
          await saveInvestments();
        }
        if (typeof data.investCashBalance === 'number'){
          state.investCashBalance = data.investCashBalance;
          await saveInvestCashBalance();
        }
        toast('Dados importados');
        renderAll();
      }catch(err){
        toast('Arquivo inválido');
      }
      e.target.value = '';
    });

    document.getElementById('resetBtn').addEventListener('click', async () => {
      if (confirm('Apagar todos os lançamentos? Essa ação não pode ser desfeita.')){
        state.transactions = [];
        await saveTxns();
        toast('Lançamentos apagados');
        renderAll();
      }
    });
  }

  /* ---------------- rendering: Projeção ---------------- */
  function renderProjecao(){
    const el = document.getElementById('view-projecao');
    if (state.transactions.length === 0){
      el.innerHTML = `<div class="empty-state">
        <p class="big">Sem dados ainda</p>
        <p>Assim que você tiver lançamentos, essa aba mostra o saldo acumulado mês a mês, inclusive parcelas futuras já lançadas.</p>
      </div>`;
      return;
    }

    // find earliest and latest month present in the data
    const months = state.transactions.map(t => t.date.slice(0,7)).sort();
    const [minY, minM] = months[0].split('-').map(Number);
    const [maxY, maxM] = months[months.length-1].split('-').map(Number);

    const todayMk = monthKey(new Date());

    let rows = [];
    let cursor = new Date(minY, minM-1, 1);
    const end = new Date(maxY, maxM-1, 1);
    let acumulado = 0;

    while (cursor <= end){
      const mk = monthKey(cursor);
      const t = monthTotals(mk);
      acumulado += t.saldo;
      rows.push({ mk, label: monthLabel(cursor), income: t.income, expense: t.expense, saldo: t.saldo, acumulado, isFuture: mk > todayMk, isCurrent: mk === todayMk });
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    }

    const rowsHtml = rows.map(r => `
      <div class="proj-row ${r.isCurrent ? 'current' : ''}">
        <div class="pm">
          <p class="lbl">${r.label}</p>
          <p class="sub">${r.isFuture ? 'previsto' : 'realizado'} · receita ${fmtBRL(r.income)} · despesa ${fmtBRL(r.expense)}</p>
        </div>
        <div class="pv">
          <p class="acc ${r.acumulado >= 0 ? 'pos' : 'neg'}">${fmtBRL(r.acumulado)}</p>
          <p class="delta">${r.saldo >= 0 ? '+' : ''}${fmtBRL(r.saldo)} no mês</p>
        </div>
      </div>
    `).join('');

    el.innerHTML = `
      <p class="section-title">Saldo acumulado</p>
      <p class="proj-note">Cada mês soma o saldo do mês anterior. Meses futuros já refletem parcelas de cartão que você lançou.</p>
      ${rowsHtml}
    `;
  }

  /* ---------------- rendering: Investimentos ---------------- */
  function renderInvestimentos(){
    const el = document.getElementById('view-investimentos');
    const cashCard = `
      <div class="invest-cash-card">
        <div>
          <p class="k">Saldo livre para investir</p>
          <p class="v">${fmtBRL(state.investCashBalance || 0)}</p>
        </div>
      </div>`;

    if (state.investments.length === 0){
      el.innerHTML = cashCard + `<div class="empty-state">
        <p class="big">Nenhuma posição ainda</p>
        <p>Toque no botão abaixo para registrar sua primeira posição de Renda Fixa, Renda Variável ou Reserva de Emergência.</p>
      </div>
      <button class="btn btn-primary" id="addInvestBtn">+ Nova posição</button>`;
      document.getElementById('addInvestBtn').addEventListener('click', () => openInvestSheet());
      return;
    }

    const totalAgg = aggregateOscillations(state.investments);
    const catBlocks = INVEST_CATEGORIES.map(cat => {
      const positions = positionsByCategory(cat);
      const catAgg = aggregateOscillations(positions);
      const positionsHtml = positions.length === 0
        ? `<p class="invest-cat-empty">Nenhuma posição em ${cat}.</p>`
        : positions.map(p => renderPositionHtml(p)).join('');
      return `
        <div class="invest-cat-block">
          <div class="invest-cat-header">
            <span class="name">${cat}</span>
            <span class="total serif">${fmtBRL(catAgg.current)}</span>
          </div>
          ${positionsHtml}
        </div>`;
    }).join('');

    el.innerHTML = cashCard + `
      <div class="invest-total-card">
        <p class="eyebrow">Patrimônio total investido</p>
        <p class="invest-total-value serif">${fmtBRL(totalAgg.current)}</p>
        <div class="invest-total-sub">
          ${INVEST_CATEGORIES.map(cat => `
            <div>
              <p class="k">${cat}</p>
              <p class="v">${fmtBRL(currentTotal(positionsByCategory(cat)))}</p>
            </div>`).join('')}
        </div>
        ${oscGridHtml(totalAgg.osc)}
      </div>

      <p class="section-title">Suas posições</p>
      ${catBlocks}

      <button class="btn btn-primary" id="addInvestBtn">+ Nova posição</button>
    `;
    document.getElementById('addInvestBtn').addEventListener('click', () => openInvestSheet());
  }

  function renderPositionHtml(p){
    const now = replayPosition(p);
    const osc = positionOscillations(p);
    const monthPct = osc.mes;
    const chipCls = (monthPct === null || monthPct === undefined) ? 'na' : (monthPct > 0 ? 'pos' : (monthPct < 0 ? 'neg' : ''));
    const chipTxt = (monthPct === null || monthPct === undefined) ? 'sem dado' : fmtPct(monthPct) + ' no mês';
    const isOpen = state.expandedInvestmentId === p.id;
    const isEditing = state.editingInvestmentId === p.id;
    const isClosed = p.status === 'encerrada';
    const qtyPM = positionQuantityPM(p);
    const gain = now.value - now.costBasis;
    const gainPct = now.costBasis > 0 ? (gain / now.costBasis) * 100 : null;
    const today = todayISO();

    let maturityLine = '';
    let maturityBanner = '';
    if (p.category === 'Renda Fixa'){
      if (p.maturity && p.maturity.type === 'definido' && p.maturity.date){
        const vencido = p.maturity.date <= today;
        maturityLine = `<p class="invest-maturity-line">Vencimento: ${fmtDateBR(p.maturity.date)}${vencido && !isClosed ? ' · vencido' : ''}</p>`;
        if (vencido && !isClosed){
          maturityBanner = `<div class="invest-maturity-banner">Este título já venceu. Ele será resgatado automaticamente (a valor de mercado, com estimativa de IR) na próxima vez que o app carregar.</div>`;
        }
      } else {
        maturityLine = `<p class="invest-maturity-line">Vencimento: indefinido</p>`;
      }
    }

    const events = sortedEvents(p).slice().reverse();
    const eventsHtml = events.map(e => {
      if (e.type === 'aporte'){
        return `<div class="invest-history-item">
          <span class="d">${fmtDateBR(e.date)} · aporte</span>
          <span class="v">${fmtBRL(e.amount)}</span>
          <button type="button" class="del-h" data-del-event="${p.id}|${e.id}" aria-label="Excluir">×</button>
        </div>`;
      }
      if (e.type === 'mark'){
        return `<div class="invest-history-item">
          <span class="d">${fmtDateBR(e.date)} · valor de mercado</span>
          <span class="v">${fmtBRL(e.value)}</span>
          <button type="button" class="del-h" data-del-event="${p.id}|${e.id}" aria-label="Excluir">×</button>
        </div>`;
      }
      return `<div class="invest-history-item">
        <span class="d">${fmtDateBR(e.date)} · resgate${e.full ? ' total' : ' parcial'}${e.note ? ' (' + escapeHtml(e.note) + ')' : ''}</span>
        <span class="v">${fmtBRL(e.amount)}${e.taxDue > 0.005 ? ' · IR ' + fmtBRL(e.taxDue) : ''}</span>
        <button type="button" class="del-h" data-del-event="${p.id}|${e.id}" aria-label="Excluir">×</button>
      </div>`;
    }).join('');

    const detailHtml = isOpen ? `
      <div class="invest-position-detail">
        ${maturityBanner}
        <p class="detail-title">Oscilação</p>
        ${oscGridHtml(osc)}

        <p class="detail-title">Histórico</p>
        <div class="invest-history-list">${eventsHtml || '<p class="invest-cat-empty">Sem eventos.</p>'}</div>

        ${!isClosed ? `
        <div class="invest-add-snap">
          <input type="date" class="snap-date" data-snap-date="${p.id}" value="${today}">
          <input type="number" inputmode="decimal" step="0.01" min="0" class="snap-value" data-snap-value="${p.id}" placeholder="Novo valor de mercado (R$)">
          <button type="button" class="btn btn-primary btn-small" data-snap-save="${p.id}">Atualizar valor de mercado</button>
        </div>` : ''}

        ${isEditing ? `
        <div class="invest-edit-row">
          <input type="text" class="pos-edit-name" value="${escapeHtml(p.name)}">
          <select class="pos-edit-cat">${INVEST_CATEGORIES.map(c => `<option value="${c}" ${c===p.category?'selected':''}>${c}</option>`).join('')}</select>
          <div class="field-full pos-edit-mat-wrap" style="${p.category === 'Renda Fixa' ? '' : 'display:none;'}">
            <label>Vencimento</label>
            <div class="seg pos-edit-mat-seg">
              <button type="button" class="seg-btn ${(!p.maturity || p.maturity.type==='indefinido') ? 'active' : ''}" data-val="indefinido">Indefinido</button>
              <button type="button" class="seg-btn ${(p.maturity && p.maturity.type==='definido') ? 'active' : ''}" data-val="definido">Data definida</button>
            </div>
            <input type="date" class="pos-edit-mat-date" value="${(p.maturity && p.maturity.date) ? p.maturity.date : ''}" style="${(p.maturity && p.maturity.type==='definido') ? '' : 'display:none;'} margin-top:8px;">
          </div>
          <div class="edit-actions">
            <button type="button" class="btn btn-ghost btn-small" data-pos-edit-cancel="${p.id}">Cancelar</button>
            <button type="button" class="btn btn-primary btn-small" data-pos-edit-save="${p.id}">Salvar</button>
          </div>
        </div>` : `
        <div class="actions-row">
          ${!isClosed ? `<button type="button" class="btn btn-ghost" data-pos-lot="${p.id}">Aumentar posição</button>` : ''}
          ${!isClosed ? `<button type="button" class="btn btn-ghost" data-pos-redeem="${p.id}">Desfazer posição</button>` : ''}
        </div>
        <div class="actions-row">
          <button type="button" class="btn btn-ghost" data-pos-edit="${p.id}">Editar</button>
          <button type="button" class="btn btn-danger" data-pos-del="${p.id}">Excluir posição</button>
        </div>`}
      </div>` : '';

    return `
      <div class="invest-position ${isOpen ? 'open' : ''}">
        <div class="invest-position-row" data-toggle="${p.id}">
          <div class="info">
            <p class="nm">${escapeHtml(p.name)}${isClosed ? '<span class="invest-status-badge">encerrada</span>' : ''}</p>
            <p class="sub">Atualizado em ${now.lastEventDate ? fmtDateBR(now.lastEventDate) : '—'}</p>
            ${qtyPM ? `<p class="invest-pm-line">${qtyPM.quantity.toLocaleString('pt-BR', {maximumFractionDigits:6})} un. · PM ${fmtBRL(qtyPM.pm)}</p>` : ''}
            ${now.costBasis > 0 ? `<p class="invest-gain-line ${gain>0?'pos':(gain<0?'neg':'')}">Ganho: ${fmtBRL(gain)}${gainPct!==null? ' ('+fmtPct(gainPct)+')' : ''}</p>` : ''}
            ${maturityLine}
          </div>
          <div class="val">
            <p class="amt serif">${fmtBRL(now.value)}</p>
            <p class="chip ${chipCls}">${chipTxt}</p>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        ${detailHtml}
      </div>`;
  }

  function openInvestSheet(){
    document.getElementById('fInvName').value = '';
    document.getElementById('fInvDate').value = todayISO();
    document.getElementById('fInvValue').value = '';
    document.getElementById('fInvQty').value = '';
    document.getElementById('fInvMaturityDate').value = '';
    document.getElementById('fInvMaturityDate').style.display = 'none';
    document.querySelectorAll('#fInvMaturityType .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.val === 'indefinido'));
    const sel = document.getElementById('fInvCategory');
    sel.innerHTML = INVEST_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('fInvMaturityWrap').style.display = sel.value === 'Renda Fixa' ? 'block' : 'none';
    investBackdrop.classList.add('show');
    investSheet.classList.add('show');
  }
  function closeInvestSheet(){
    investBackdrop.classList.remove('show');
    investSheet.classList.remove('show');
  }

  function openLotSheet(positionId){
    const p = state.investments.find(x => x.id === positionId);
    if (!p) return;
    state.lotPositionId = positionId;
    document.getElementById('lotPositionName').textContent = p.name;
    document.getElementById('fLotDate').value = todayISO();
    document.getElementById('fLotValue').value = '';
    document.getElementById('fLotQty').value = '';
    document.getElementById('fLotFromBalance').classList.remove('on');
    document.getElementById('lotBalanceHint').textContent = fmtBRL(state.investCashBalance || 0);
    lotBackdrop.classList.add('show');
    lotSheet.classList.add('show');
  }
  function closeLotSheet(){
    lotBackdrop.classList.remove('show');
    lotSheet.classList.remove('show');
  }

  function openRedeemSheet(positionId){
    const p = state.investments.find(x => x.id === positionId);
    if (!p) return;
    state.redeemPositionId = positionId;
    const now = replayPosition(p);
    document.getElementById('redeemPositionName').textContent = p.name;
    document.getElementById('fRedeemDate').value = todayISO();
    document.getElementById('fRedeemValue').value = now.value ? now.value.toFixed(2) : '';
    document.getElementById('fRedeemRate').value = '';
    updateRedeemPreview();
    redeemBackdrop.classList.add('show');
    redeemSheet.classList.add('show');
  }
  function closeRedeemSheet(){
    redeemBackdrop.classList.remove('show');
    redeemSheet.classList.remove('show');
  }
  function updateRedeemPreview(){
    const p = state.investments.find(x => x.id === state.redeemPositionId);
    const previewEl = document.getElementById('redeemPreview');
    const noteEl = document.getElementById('redeemNote');
    if (!p){ previewEl.innerHTML = ''; noteEl.textContent = ''; return; }
    const date = document.getElementById('fRedeemDate').value || todayISO();
    const amount = Number(document.getElementById('fRedeemValue').value);
    const rateInput = document.getElementById('fRedeemRate').value;
    const rateOverride = rateInput === '' ? null : Number(rateInput) / 100;
    const preview = previewRedeem(p, date, amount, rateOverride);
    if (!preview){
      previewEl.innerHTML = `<div class="row"><span class="k">Informe um valor válido</span></div>`;
      noteEl.textContent = '';
      return;
    }
    if (rateInput === ''){
      document.getElementById('fRedeemRate').value = (preview.suggestedRate * 100).toFixed(1);
    }
    previewEl.innerHTML = `
      <div class="row"><span class="k">Ganho estimado</span><span class="v">${fmtBRL(preview.gain)}</span></div>
      <div class="row"><span class="k">IR estimado</span><span class="v">${fmtBRL(preview.taxDue)}</span></div>
      <div class="row total"><span class="k">Valor líquido</span><span class="v">${fmtBRL(preview.netAmount)}</span></div>
    `;
    noteEl.textContent = p.category === 'Renda Variável'
      ? 'Ações costumam ser isentas de IR se o total de vendas no mês não passar de R$ 20.000; acima disso, geralmente 15% sobre o ganho, apurado e pago via DARF até o último dia útil do mês seguinte. Ajuste a alíquota se souber que é diferente. Isso é uma estimativa educativa, não substitui orientação de um contador.'
      : 'IR sobre renda fixa costuma ser retido na fonte pela instituição no resgate, pela tabela regressiva (22,5% até 180 dias, 20% até 360, 17,5% até 720, 15% acima disso). Se este título for isento (LCI, LCA, poupança), ajuste a alíquota para 0%. Isso é uma estimativa educativa, não substitui orientação de um contador.';
  }

  /* ---------------- tab / month controls ---------------- */
  function renderAll(){
    document.getElementById('monthLabel').textContent = monthLabel(state.currentMonth);
    renderResumo();
    renderExtrato();
    renderProjecao();
    renderInvestimentos();
    renderMetas();
  }

  function setTab(tab){
    state.activeTab = tab;
    document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + tab).classList.add('active');
  }

  document.querySelectorAll('nav.tabbar button').forEach(b => {
    b.addEventListener('click', () => setTab(b.dataset.tab));
  });

  document.getElementById('prevMonth').addEventListener('click', () => {
    state.currentMonth.setMonth(state.currentMonth.getMonth() - 1);
    state.currentMonth = new Date(state.currentMonth);
    renderAll();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    state.currentMonth.setMonth(state.currentMonth.getMonth() + 1);
    state.currentMonth = new Date(state.currentMonth);
    renderAll();
  });

  /* ---------------- extrato: editar / excluir ---------------- */
  document.getElementById('view-extrato').addEventListener('click', async (e) => {
    const delId = e.target.getAttribute('data-del');
    if (delId){
      const txn = state.transactions.find(t => t.id === delId);
      if (!txn) return;
      const installmentNote = txn.installment ? ` Essa é a parcela ${txn.installment.index}/${txn.installment.total} — só ela será excluída, as outras parcelas continuam.` : '';
      const recurringNote = txn.recurring ? ` Essa é uma ocorrência (${txn.recurring.index}/${txn.recurring.total}) de uma receita recorrente — só ela será excluída, as outras continuam.` : '';

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const amount = Number(document.getElementById('fAmount').value);
    const date = document.getElementById('fDate').value || todayISO();
    const description = document.getElementById('fDesc').value.trim();
    const category = document.getElementById('fCategory').value;
    const account = document.getElementById('fAccount').value;
    const essential = essSwitch.classList.contains('on');

    if (!amount || amount <= 0){
      toast('Informe um valor válido');
      return;
    }
    if (category === '__new__'){
      toast('Preencha e adicione a categoria nova primeiro');
      return;
    }
    if (account === '__new__'){
      toast('Preencha e adicione a conta nova primeiro');
      return;
    }

    const isDespesa = state.formType === 'despesa';
    const bucket = isDespesa ? (state.categories[category] || 'CONFORTO') : null;
    const paymentMethod = isDespesa ? state.paymentMethod : null;

    if (state.editingId){
      const idx = state.transactions.findIndex(t => t.id === state.editingId);
      if (idx === -1){
        toast('Lançamento não encontrado');
        closeSheet();
        return;
      }
      const original = state.transactions[idx];
      state.transactions[idx] = {
        ...original,
        type: state.formType,
        amount, date, description, category, bucket, account,
        paymentMethod,
        essential: isDespesa ? essential : false
      };
      await saveTxns();
      closeSheet();
      toast('Alterações salvas');
      const entryMonth = date.slice(0,7);
      if (entryMonth !== monthKey(state.currentMonth)){
        const [y,m] = entryMonth.split('-').map(Number);
        state.currentMonth = new Date(y, m-1, 1);
      }
      renderAll();
      return;
    }

    const installments = (isDespesa && paymentMethod === 'credito') ? Math.max(1, parseInt(document.getElementById('fInstallments').value, 10) || 1) : 1;
    const isRecurring = !isDespesa && recurringSwitch.classList.contains('on');
    const recurringMonths = isRecurring ? Math.max(1, parseInt(document.getElementById('fRecurringMonths').value, 10) || 1) : 1;
    const occurrences = isDespesa ? installments : recurringMonths;

    const groupId = occurrences > 1 ? uid() : null;
    const newTxns = [];
    for (let i = 0; i < occurrences; i++){
      newTxns.push({
        id: uid(),
        type: state.formType,
        amount,
        date: addMonths(date, i),
        description: (isDespesa && installments > 1) ? `${description || category} (${i+1}/${installments})` : description,
        category, bucket, account,
        paymentMethod,
        installment: (isDespesa && installments > 1) ? { index: i+1, total: installments, groupId } : null,
        recurring: (isRecurring) ? { index: i+1, total: recurringMonths, groupId } : null,
        essential: isDespesa ? essential : false,
        createdAt: Date.now()
      });
    }
    state.transactions.push(...newTxns);
    await saveTxns();
    closeSheet();
    toast(occurrences > 1 ? `${occurrences} lançamentos criados` : 'Lançamento salvo');

    // jump to the month of the first entry if different from current view
    const entryMonth = date.slice(0,7);
    if (entryMonth !== monthKey(state.currentMonth)){
      const [y,m] = entryMonth.split('-').map(Number);
      state.currentMonth = new Date(y, m-1, 1);
    }
    renderAll();
  });

  /* ---------------- init ---------------- */
  (async function init(){
    const maturedCount = await loadAll();
    renderAll();
    if (maturedCount > 0){
      toast(maturedCount === 1 ? '1 título venceu e foi resgatado automaticamente' : `${maturedCount} títulos venceram e foram resgatados automaticamente`);
    }
  })();

})();
</script>
</body>
</html>
